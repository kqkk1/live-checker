<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アイマス ライブ・イベント情報ポータル</title>
<meta name="description" content="アイマスのライブ・イベントのチケット受付状況と、自分の参戦記録をまとめて確認できる非公式サイトです。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="アイマス ライブ・イベント情報ポータル">
<meta property="og:locale" content="ja_JP">
<meta property="og:url" content="https://kqkk1.github.io/live-checker/">
<meta property="og:image" content="https://kqkk1.github.io/live-checker/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta property="og:title" content="アイマス ライブ・イベント情報ポータル（非公式）">
<meta property="og:description" content="チケットの受付状況と、自分の参戦記録をひとつに。">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111214'/%3E%3Crect x='7.5' y='9' width='17' height='15' rx='3' fill='none' stroke='%23a3b6ff' stroke-width='2'/%3E%3Cpath d='M7.5 14h17M12 6.5v4M20 6.5v4' stroke='%23a3b6ff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<script>/* 画面を描く前にテーマを決めて、ライトの人に一瞬ダークが映るのを防ぐ */
(function () { try { var t = (localStorage.getItem('imas_portal_theme_v1') || 'auto').replace('glass', 'dark');
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; } catch (e) {} })();</script>
<style>
/* 見た目の設定。上から「変数 → 土台 → 画面の上から順の部品 → ライトテーマ → 動き」の順に並べています。
   色を変えるときは一番上の変数（ライトは「テーマ：ライト」の変数）だけを直せば、全体に反映されます。 */
/* ===== 色・サイズの変数（ダークが基準。ライトは下の「テーマ：ライト」で上書き） ===== */
:root{--bg:#111214;--surface:#17181b;--surface2:#1d1e22;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--text:#ececf0;--muted:#9c9ea8;--accent:#a3b6ff;--ok:#94d48c;--warn:#ff95a4;--gold:#e8bd78;--r:14px;--inv:#111214;--sheet:#151619;--toast:#232428;--skip:#3a3b41;--nav:rgba(17,18,20,.92);--sel:var(--text);--sel-fg:var(--inv);--sel-line:var(--text);--cta:var(--text);--cta-fg:var(--inv);--ease:cubic-bezier(.2,.8,.2,1);--ease-sheet:cubic-bezier(.32,.72,0,1)}
html[data-theme="light"]{color-scheme:light;--bg:#f5f4f0;--surface:#ffffff;--surface2:#fbfaf7;--line:rgba(20,22,28,.09);--line2:rgba(20,22,28,.2);--text:#17181c;--muted:#5d606a;--accent:#3554c9;--ok:#2a7a37;--warn:#c03050;--gold:#9a5f0c;--inv:#ffffff;--sheet:#ffffff;--toast:#ffffff;--skip:#e4e3df;--nav:rgba(245,244,240,.92);--sel:rgba(53,84,201,.1);--sel-fg:#2a45b0;--sel-line:rgba(53,84,201,.32);--cta:#3554c9;--cta-fg:#ffffff;--orb1:#b9c8ff;--orb2:#ffd0e2;--orb:.8;--spot:rgba(53,84,201,.06)}
html[data-theme="dark"]{color-scheme:dark;--orb1:#3f5bd6;--orb2:#b23a7a;--orb:.28}

/* ===== 土台（リセット・文字・ボタン共通・アイコン） ===== */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom);font-feature-settings:"palt";letter-spacing:.015em;line-height:1.6;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .12s var(--ease),background-color .18s,color .18s,border-color .18s}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.sub{color:var(--muted);font-size:12px;margin-top:2px;text-wrap:pretty}
.wrap-in{position:relative}
.wrapr{flex-wrap:wrap;overflow:visible}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
header{padding:28px 0 8px}
h1{font-size:20px;font-weight:700;letter-spacing:.06em}
.nb{display:inline-block}
button:active:not(:disabled){transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;display:inline-block}
.sub .ic{margin-right:4px;opacity:.85}
@media(min-width:768px){
  h1{font-size:24px}
}

/* ===== ページ上部（タイトル・数字・データ確認） ===== */
.stale{color:var(--warn)}
.hero{position:relative;padding:44px 0 18px;isolation:isolate}
.hero-bg{position:absolute;z-index:-1;inset:-40px -50vw 0;pointer-events:none;overflow:hidden;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.hero-bg::before{content:"";position:absolute;width:56vmax;height:56vmax;border-radius:50%;opacity:var(--orb,.16);left:calc(50% - 46vmax);top:-30vmax;background:radial-gradient(closest-side,var(--orb1),transparent)}
.hero-bg::after{content:"";position:absolute;width:56vmax;height:56vmax;border-radius:50%;opacity:var(--orb,.16);left:calc(50% - 6vmax);top:-34vmax;background:radial-gradient(closest-side,var(--orb2),transparent)}
.kicker{font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--muted);margin-bottom:10px}
.hero h1{font-size:28px;line-height:1.25;letter-spacing:.04em;text-wrap:balance}
.lead{margin-top:8px;color:var(--muted);font-size:13px;max-width:36em;text-wrap:pretty}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px;min-height:46px}
.stat{display:flex;align-items:baseline;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card,transparent);color:var(--muted);font-size:12px;font-weight:600;text-align:left}
.stat b{font-size:20px;color:var(--text);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.stat.u b{color:var(--warn)}
.stat.g b{color:var(--ok)}
.stat:hover{border-color:var(--line2)}
.stat:disabled{opacity:.6;cursor:default}
.upd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;min-height:34px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.upd .stale{color:var(--warn);font-weight:700}
.ulink{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 2px;font-size:12px;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.ulink:hover{color:var(--text)}
.ulink .ic{opacity:.8}
.hset{position:absolute;top:14px;right:0;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;background:var(--surface)}
.hset:hover{color:var(--text);border-color:var(--line2)}
.hset .ic{width:17px;height:17px}
@media(max-width:560px){
  .stats{display:grid;grid-template-columns:repeat(3,1fr);min-height:62px}
  .stat{flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;font-size:11px;line-height:1.35}
  .hset span{display:none}
  .hset{width:40px;justify-content:center;padding:0}
}
@media(min-width:768px){
  .hero{padding:64px 0 22px}
  .hero h1{font-size:40px}
}

/* ===== 切り替えタブ・検索・絞り込み（スクロールすると上に固定） ===== */
.tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0 8px;margin-bottom:6px;transition:background .2s,box-shadow .2s}
.crow{display:flex;gap:8px;align-items:center;margin-top:8px}
.seg2{display:flex;flex:none;gap:2px;padding:3px;border-radius:12px;background:transparent;border:1px solid var(--line)}
.vb{min-width:44px;min-height:40px;padding:0 10px;border-radius:9px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px}
.vl{display:none}
.fbtn{flex:none;min-height:46px;max-width:42vw;padding:0 14px;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:transparent;border-color:var(--line)}
.fbtn.on{color:var(--accent);border-color:var(--accent)}
.fpanel{position:absolute;left:0;right:0;top:100%;z-index:30;margin-top:6px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 16px 40px rgba(0,0,0,.45)}
.fpanel[hidden]{display:none}
.fl{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 6px}
.fl+.row{margin-bottom:10px}
.tab{flex:none;min-height:44px;padding:8px 14px;border-radius:999px;white-space:nowrap;background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600}
.tab b{margin-left:5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.chip{flex:none;min-height:40px;padding:4px 14px;display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12px;border-color:var(--line)}
.search{flex:1;min-width:0;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);color:var(--text);font-size:14px;background:transparent;border-color:var(--line)}
.tab.on{background:var(--sel);color:var(--sel-fg);box-shadow:none;border-color:var(--sel-line)}
.tab.on b{color:var(--sel-fg)}
.vb.on{background:var(--sel);color:var(--sel-fg);box-shadow:none}
.chip.on{background:var(--sel);border-color:var(--sel-line);color:var(--sel-fg);font-weight:700}
.search:focus{outline:none;border-color:var(--line2)}
.navttl{display:none;font-weight:700;font-size:13px;letter-spacing:.06em;margin-right:auto;white-space:nowrap}
body.scrolled .tools{background:var(--nav);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);box-shadow:0 1px 0 var(--line)}
.vi .ic{width:17px;height:17px;vertical-align:-.25em}
@media(min-width:768px){
  .vl{display:inline}
  .fbtn{display:none}
  .search{max-width:420px}
  .fpanel{display:flex!important;flex-wrap:wrap;align-items:center;gap:8px 20px;position:static;margin-top:8px;padding:0;border:0}
  .fpanel .fl{display:none}
  .fpanel .row,.fpanel .fl+.row{margin:0}
  .tools{position:sticky}
  .tools .wrap-in{position:relative}
  body.scrolled .navttl{display:block}
  .crow{gap:10px}
}

/* ===== 今チェックしたいもの ===== */
.todo{margin:8px 0 14px;padding:14px;background:transparent;border:1px solid var(--line);border-radius:var(--r)}
.todo h2{margin-bottom:10px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:8px}
.todo-list{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.todo-item{flex:0 0 min(260px,78%);scroll-snap-align:start;text-align:left;border:1px solid var(--line);padding:10px 12px;background:var(--surface);border-color:var(--line);border-radius:12px}
.todo-item b{display:block;font-size:13px;line-height:1.4;margin-bottom:2px}
.todo-item span{font-size:12px;color:var(--warn)}
.todo-item.soon span{color:var(--accent)}
.todo h2 .ic{color:var(--muted)}

/* ===== 受付状況のカード ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;padding-bottom:60px}
.card{position:relative;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s,background .15s;padding:18px 18px 16px 22px;gap:7px}
.card::before{content:"";position:absolute;left:0;background:var(--b);width:3px;top:14px;bottom:14px;border-radius:0 3px 3px 0}
.card.closed .body{opacity:.5}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.xr{display:inline-block;padding:0 7px;margin-right:5px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.04em;color:#0c1030;background:#ffd166;vertical-align:1px}
.tag{border-radius:6px;font-size:11px;background:none!important;color:var(--muted);font-weight:600;padding:0;margin-right:12px;display:inline-flex;align-items:center;gap:6px}
.badge{border-radius:999px;font-size:12px;white-space:nowrap;background:none!important;padding:0;display:inline-flex;align-items:center;gap:6px;font-weight:700;letter-spacing:.04em}
.badge.open{background:rgba(158,206,106,.18);color:var(--ok)}
.badge.urgent{background:rgba(247,118,142,.2);color:var(--warn)}
.badge.before{background:rgba(122,162,247,.15);color:var(--accent)}
.badge.closed,.badge.tbd{background:#2c2c2c;color:var(--muted)}
.card h2{line-height:1.35;font-size:17px;font-weight:700;letter-spacing:.03em;text-wrap:balance}
.phase{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.range{font-size:14px;font-variant-numeric:tabular-nums;font-weight:600}
.remain{font-size:12px;color:var(--muted)}
.remain.urgent{color:var(--warn);font-weight:800}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px;margin-top:8px;padding:3px;background:transparent;border:1px solid var(--line);border-radius:12px}
.seg button{min-height:44px;font-size:12px;font-weight:700;color:var(--muted);border-radius:9px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 12px}
.hints{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.lot{font-size:12px;color:var(--gold);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dchip{min-height:40px;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--muted);background:transparent}
.dchip.w{color:var(--gold);border-color:var(--gold)}
.dchip.ok{color:var(--ok);border-color:var(--ok)}
.dchip.ng{color:var(--warn);border-color:var(--warn)}
.dchip.sk{border-style:dashed}
.card:hover{background:var(--surface2);border-color:var(--line2)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,#7b7f99)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.seg button.on{background:var(--sel);color:var(--sel-fg);box-shadow:none}
.seg button.on[data-st^="当選"],.seg button.on[data-st="入手🎫"]{background:var(--ok);color:var(--inv);box-shadow:none}
.seg button.on[data-st^="落選"],.seg button.on[data-st="入手できず"]{background:var(--warn);color:var(--inv);box-shadow:none}
.seg button.on[data-st="見送り"]{background:var(--skip);color:var(--text);box-shadow:none}
.empty p{text-wrap:pretty}
.meta .ic{opacity:.75;margin-right:3px}
.meta>span{display:inline-flex;align-items:center;gap:2px;margin-right:12px;white-space:nowrap}
.lot .ic{margin-right:4px;opacity:.85}
@media(hover:hover) and (pointer:fine){
  .card{transition:border-color .2s,background-color .2s}
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),var(--spot,rgba(255,255,255,.06)),transparent 70%)}
  .card:hover::after{opacity:1}
}

/* ===== 公演日順の一覧・カレンダー登録 ===== */
.dlist{display:flex;flex-direction:column;padding-bottom:60px;gap:6px}
.mh{padding-bottom:4px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);border-bottom:0;margin:22px 0 4px}
.drow{position:relative;display:grid;grid-template-columns:140px 1fr auto;gap:10px;align-items:center;padding:10px 12px 10px 18px;cursor:pointer;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s,background .15s}
.drow::before{content:"";position:absolute;left:0;background:var(--b);width:3px;top:14px;bottom:14px;border-radius:0 3px 3px 0}
.ddate{font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums;font-weight:700}
.dmain b{display:block;font-size:14px;line-height:1.35}
.dside{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.dstat{border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;background:none!important;padding:0;display:inline-flex;align-items:center;gap:6px;letter-spacing:.03em}
.dstat.ok{background:rgba(158,206,106,.18);color:var(--ok)}
.dstat.w{background:rgba(224,175,104,.18);color:var(--gold)}
.dstat.sk{background:#2c2c2c;color:var(--muted)}
.dstat.ng{background:rgba(247,118,142,.15);color:var(--warn)}
.drow.dim{opacity:.55}
.drow.dim:hover{opacity:.8}
.dtime{display:block;font-weight:600;font-size:12px;color:var(--muted);margin-top:2px}
.dday{display:inline-block;border-radius:6px;font-weight:800;vertical-align:1px;background:none;color:var(--ok);padding:0;margin-right:8px;font-size:12px}
.calbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 2px;padding:12px 14px;background:transparent;border:1px solid var(--line);border-radius:var(--r)}
.calbox .ct{flex:1 1 220px;font-size:13px;line-height:1.5}
.calbox .ct b{font-size:14px;display:flex;align-items:center;gap:8px}
.calbox .btn{margin-top:0;flex:0 0 auto;padding:10px 16px;background:var(--cta);border-color:var(--cta);color:var(--cta-fg)}
.drow:hover{background:var(--surface2);border-color:var(--line2)}
.dstat::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.calbox .ct b .ic{color:var(--muted)}
@media(hover:hover) and (pointer:fine){
  .drow{transition:border-color .2s,background-color .2s}
  .drow::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),var(--spot,rgba(255,255,255,.06)),transparent 70%)}
  .drow:hover::after{opacity:1}
}
@media(max-width:767px){
  .drow{grid-template-columns:1fr auto}
  .ddate{grid-column:1/-1}
}

/* ===== イベント詳細パネル ===== */
.back{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;z-index:50;transition:opacity .3s var(--ease)}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:51;overflow-y:auto;display:flex;flex-direction:column;padding:0;background:var(--sheet);transition:transform .42s var(--ease-sheet)}
.sheet h3{font-size:20px;line-height:1.35;margin:8px 0 12px;text-wrap:balance}
.sheet>*{flex:none}
.sbody{padding:4px 18px calc(32px + env(safe-area-inset-bottom))}
.sheet.hascta .sbody{padding-bottom:20px}
.bar{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;gap:2px;padding:6px 8px;background:var(--sheet)}
.bar .x{position:static}
.meta2{color:var(--muted);font-size:13px;margin:-4px 0 12px}
.next{margin-top:4px;padding:14px;border:1px solid var(--line);background:transparent;border-radius:var(--r)}
.next .nt{font-size:17px;font-weight:800;line-height:1.35;display:flex;align-items:center;gap:8px}
.next .ns{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.5}
.next.go{border-color:var(--accent);background:transparent}
.next.urgent{border-color:var(--warn);background:transparent}
.next.wait{border-color:var(--gold);background:transparent}
.next.ok{border-color:var(--ok);background:transparent}
.next .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.next .acts .btn{margin-top:0;flex:1 1 200px;font-size:13px}
.rec{margin-top:16px}
.rh{font-size:13px;font-weight:800;margin-bottom:2px}
.acc{margin-top:12px;border:1px solid var(--line);background:transparent;border-color:var(--line);border-radius:12px}
.acc.mini{margin-top:10px}
.acc>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;cursor:pointer}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"＋";color:var(--muted);font-size:16px;flex:none}
.acc[open]>summary::after{content:"－"}
.at{font-weight:800;font-size:14px;flex:none}
.ah{margin-left:auto;color:var(--muted);font-size:12px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ab{padding:0 14px 14px}
.acc .sched,.acc .mtime{background:var(--surface)}
.acc .memo{margin-top:0}
.cta{position:sticky;bottom:0;z-index:2;margin:auto 0 0;padding:10px 18px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--sheet)}
.cta .btn{margin-top:0;background:var(--cta);border-color:var(--cta);color:var(--cta-fg)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.btn{display:block;text-align:center;padding:12px;border-radius:8px;font-weight:700;margin-top:8px;background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.sp{background:rgba(224,175,104,.15);color:var(--gold);border-color:var(--gold)}
.sched{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px}
.sched summary{cursor:pointer;color:var(--muted);font-size:12px;margin:6px 0}
.memo{width:100%;min-height:72px;margin-top:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.x{position:absolute;top:6px;right:8px;font-size:20px;min-width:44px;min-height:44px;color:var(--muted)}
.sheet.on ~ .toast{bottom:calc(24px + env(safe-area-inset-bottom))}
.sheet.on.hascta ~ .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
.mrow{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.mrow .badge{flex:none;margin-top:2px}
.mrow.done{opacity:.55}
.mtime{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:13px;line-height:1.6}
.mtime .mt{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:2px}
.btn.sm{display:inline-block;padding:8px 14px;margin-top:6px;font-size:13px}
.slotrow{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.slotrow .badge{flex:none;margin-top:2px}
.dayrow{margin-top:12px}
.dayrow b{display:block;margin-bottom:6px;font-size:13px}
.by{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:6px}
.by button{min-height:44px;border-radius:8px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.mode{display:flex;align-items:center;gap:6px;margin:4px 0 10px;font-size:12px;color:var(--muted)}
.mode button{min-height:44px;padding:4px 14px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.mode button.on,.by button.on{background:var(--sel);border-color:var(--sel-line);color:var(--sel-fg)}
.meta2 .ic{opacity:.75;margin-right:3px}
.meta2>span{display:inline-flex;align-items:center;gap:2px;margin-right:12px;white-space:nowrap}
.mt .ic{margin-right:4px;opacity:.85}
.btn .ic{margin-right:6px}
.x .ic{width:20px;height:20px}
.next .nt::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent)}
.next.ok .nt::before{background:var(--ok)}
.next.wait .nt::before{background:var(--gold)}
.next.urgent .nt::before{background:var(--warn)}

@media(max-width:767px){
  .sheet{left:0;right:0;bottom:0;height:90dvh;border-radius:20px 20px 0 0;transform:translateY(100%)}
  .sheet.on{transform:none}
}

  .sheet{top:0;right:0;bottom:0;width:520px;transform:translateX(100%);box-shadow:-12px 0 32px rgba(0,0,0,.5)}

}

/* ===== ダイアログ（設定・共有・カレンダー）とトースト ===== */
.dlgb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:70;display:flex;align-items:center;gap:8px;width:max-content;max-width:min(92vw,520px);padding:4px 6px 4px 16px;border-radius:12px;border:1px solid #555;font-size:13px;transition:opacity .2s,transform .2s;background:var(--toast);border-color:var(--line2);color:var(--text)}

.dlg ol{margin:6px 0 4px 18px;font-size:12px;color:var(--muted);line-height:1.6}
.dlg .how{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}

.about:focus{outline:none}

.about p b{color:var(--text)}
.about .stale{color:var(--warn);font-weight:700}
.dlg h3 .ic{color:var(--muted)}

.thopt .pv i:nth-child(3){top:34px;width:30%;height:12px;border-radius:4px}
.pv.d{background:#111214}
.pv.d i,.pv.d i:nth-child(3){background:#ececf0}
.pv.l{background:#f5f4f0}
.pv.l i{background:#17181c}

.pv.a{background:linear-gradient(90deg,#111214 50%,#f5f4f0 50%)}

.thopt b .ic{width:16px;height:16px;color:var(--accent)}
.thopt small{font-size:11px;color:var(--muted);line-height:1.4}

/* ===== ページ下 ===== */
.foot{max-width:1180px;margin:0 auto;margin-top:24px;padding:18px 0 8px;border-top:1px solid var(--line)}
.foot .ulink{margin-left:6px}

/* ===== テーマ：ライト ===== */
html[data-theme="light"] .card,html[data-theme="light"] .drow{box-shadow:0 1px 2px rgba(20,22,28,.04)}
html[data-theme="light"] .back{background:rgba(20,22,28,.35)}
html[data-theme="light"] .sheet{box-shadow:-12px 0 32px rgba(20,22,28,.12)}
html[data-theme="light"] .fpanel{box-shadow:0 16px 40px rgba(20,22,28,.12)}

html[data-theme="light"] .seg button.on{box-shadow:inset 0 0 0 1px var(--sel-line)}
html[data-theme="light"] .seg button.on[data-st^="当選"],html[data-theme="light"] .seg button.on[data-st="入手🎫"]{background:rgba(42,122,55,.12);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(42,122,55,.35)}
html[data-theme="light"] .seg button.on[data-st^="落選"],html[data-theme="light"] .seg button.on[data-st="入手できず"]{background:rgba(192,48,80,.09);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(192,48,80,.3)}
html[data-theme="light"] .seg button.on[data-st="見送り"]{background:var(--skip);color:var(--muted);box-shadow:none}
html[data-theme="light"] .xr{background:#ffd166}

/* ===== 動き（端末で「視差効果を減らす」がオンなら止まる） ===== */
@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
}
@media(prefers-reduced-motion:no-preference){
  .hero-bg::before{animation:drift1 26s ease-in-out infinite alternate}
  .hero-bg::after{animation:drift2 32s ease-in-out infinite alternate}
  .reveal{animation:rv .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
  .hero h1 .w{display:inline-block;animation:rvw .8s var(--ease) both;animation-delay:calc(120ms + var(--i,0) * 90ms)}
}
@media(prefers-reduced-motion:no-preference){
  @keyframes drift1{to{transform:translate(8vmax,3vmax) scale(1.08)}}
  @keyframes drift2{to{transform:translate(-7vmax,4vmax) scale(.94)}}
  @keyframes rv{from{opacity:0;transform:translateY(8px);filter:blur(4px)}}
  @keyframes rvw{from{opacity:0;transform:translateY(.25em);filter:blur(8px)}}
}
</style>

<body>
<noscript><p style="padding:16px;text-align:center">このサイトを使うには JavaScript を有効にしてください。</p></noscript>
<div class="wrap">

    <p class="kicker reveal" style="--i:0">UNOFFICIAL ・ LIVE &amp; EVENT</p>
    <h1><span class="nb w" style="--i:0">アイマス</span> <span class="nb w" style="--i:1">ライブ情報ポータル</span></h1>
    <p class="lead reveal" style="--i:3">チケットの受付と、自分の参戦記録をひとつに。</p>

  <div class="tools"><div class="wrap-in">
    <div class="row" id="tabs"></div>
    <div class="crow">
      <span class="navttl" aria-hidden="true">アイマス ライブ情報ポータル</span>
      <div class="seg2" id="viewrow" role="group" aria-label="表示の切り替え"></div>
      <input class="search" id="q" type="search" placeholder="検索" aria-label="ライブ名・会場・出演者で検索">
      <button class="fbtn" id="fbtn" aria-expanded="false" aria-controls="fpanel">絞り込み ▾</button>
    </div>
    <div class="fpanel" id="fpanel" hidden>
      <div class="fl">ブランド</div><div class="row wrapr" id="brands"></div>
      <div class="fl">参戦スタイル<span class="sub">（連番の管理）</span></div><div class="row" id="gmode"></div>
      <div class="fl">記録の共有<span class="sub">（友人と状況を揃える）</span></div><div class="row"><button class="chip" data-sharestate><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg> 記録を共有リンクにする</button></div>
    </div>
  </div></div>
  <main class="grid" id="grid"></main>
  <footer class="foot">
    <p class="sub">このサイトは非公式の情報まとめです。公式サイト・各チケット販売ページとは関係ありません。<button class="ulink" data-settings="about">このサイトについて</button></p>
  </footer>
</div>
<div class="back" id="back"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="イベント詳細" inert></aside>
<div class="dlgb" id="dlgb" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-label="記録の共有"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = 'imas_portal_user_state_v1';
const BR = {'765AS':'#ff6b6b','デレマス':'#4aa8ff','ミリオン':'#ffcb3d','シャニマス':'#8fb8ff','SideM':'#33d6b0','学マス':'#ff9f2e','ヴイアラ':'#b99cff'};
const BRANDS = ['すべて', ...Object.keys(BR)];
// 抽選系（先行・一般抽選・リセールなど）と先着で、ボタンの言葉を切り替える
const ST_LOT  = [['当落待ち⏳','当落待ち'],['当選🎉','当選'],['落選💦','落選'],['見送り','見送り']];
const ST_FCFS = [['入手🎫','入手'],['入手できず','入手できず'],['見送り','見送り']];
const DONE = ['当落待ち⏳','当選🎉','落選💦','入手🎫','入手できず'];   // 応募・購入に動いたもの
const isFcfs = ev => ev.phaseKind ? ev.phaseKind === '先着' : /先着/.test(ev.phase || '');
const BY = ['自分','連番者'];
/* ---- 線のアイコン（絵文字の代わり。文字と同じ色・太さで、どのテーマにもなじむ） ---- */
const ICONS = {
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  pin: '<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  list: '<path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/>',
  map: '<path d="M3.5 6.5l5.5-2.5 6 2.5 5.5-2.5v13.5l-5.5 2.5-6-2.5-5.5 2.5z"/><path d="M9 4v13.5M15 6.5V20"/>',
  bell: '<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  ticket: '<path d="M3.5 7.5h17V10a2 2 0 0 0 0 4v2.5h-17V14a2 2 0 0 0 0-4z"/><path d="M14.5 7.5v9" stroke-dasharray="1.5 2"/>',
  user: '<circle cx="12" cy="8" r="3.5"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>',
  wand: '<path d="M4.5 19.5l10-10"/><path d="M13 8l3 3"/><path d="M18 3.5v3M16.5 5h3M19.5 11v2M18.5 12h2M11 3v2M10 4h2"/>',
  note: '<path d="M5 19h3.5L19 8.5 15.5 5 5 15.5z"/><path d="M13.5 7l3.5 3.5"/>',
  info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>',
  alert: '<path d="M12 4.5l8.5 15h-17z"/><path d="M12 10.5v4M12 17h.01"/>',
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const LBL = {...Object.fromEntries([...ST_LOT, ...ST_FCFS]), '未申込':'未'};

/* ---- Day別管理 ---- */
const shortK = k => k.replace('公演', '');
const kshort = k => shortK(k).replace(/\s+/g, '');   // ボタン用の短縮（例: 「Day1 昼公演」→「Day1昼」）。記録の保存キー(k)は変えない
const subOf = sc => (sc && (sc.name || (String(sc.label || '').match(/「(.+)」/) || [])[1])) || '';   // 公演のサブタイトル（公演名）
const klabels = ev => dkeys(ev).map((k, i) => { const sub = subOf((ev.schedules || [])[i]); return shortK(k) + (sub ? ` 「${sub}」` : ''); });   // 記録・表示用のラベル（サブタイトルつき。例: Day1 昼 「ただ眩しかった」）
const dkeys = ev => { const seen = {}; return (ev.schedules || []).map((s, i) => { let k = String(s.label || '').split(/[:：]/)[0].trim() || `公演${i+1}`; if (seen[k]) k += `#${i+1}`; seen[k] = 1; return k; }); };
const dget = (st, k) => (st.days && st.days[k] && st.days[k].status) || st.status;
const dstats = ev => { const st = me(ev.id), ks = dkeys(ev); return (ks.length ? ks : ['_']).map(k => dget(st, k)); };
const anyDone = ev => dstats(ev).some(v => DONE.includes(v));
const allSkip = ev => dstats(ev).every(v => v === '見送り');
const pend = ev => !anyDone(ev) && !allSkip(ev);            // まだ何も動いていない
const common = ev => { const a = dstats(ev); return a.every(v => v === a[0]) ? a[0] : null; };   // 全公演が同じ状態ならその値
function mat(ev) { const st = me(ev.id); st.days = st.days || {}; dkeys(ev).forEach(k => { st.days[k] = st.days[k] || {}; if (!st.days[k].status) st.days[k].status = st.status; }); return st; }
function sync(ev, st) { const c = common(ev); if (c) st.status = c; st.applied = anyDone(ev); }
function setAll(ev, v) { const st = mat(ev), nv = common(ev) === v ? '未申込' : v; st.status = nv; dkeys(ev).forEach(k => { st.days[k].status = nv; }); sync(ev, st); }
function setDay(ev, k, v) { const st = mat(ev); st.days[k].status = st.days[k].status === v ? '未申込' : v; sync(ev, st); }
function cycleDay(ev, k) { const st = mat(ev), set = (isFcfs(ev) ? ST_FCFS : ST_LOT).map(a => a[0]), i = set.indexOf(st.days[k].status); st.days[k].status = i === set.length - 1 ? '未申込' : set[i + 1]; sync(ev, st); }
/* ---- /Day別管理 ---- */

const TABS = [['now','今応募できる'],['before','受付前・未定'],['mine','応募済み'],['skip','見送り'],['closed','終了'],['all','すべて']];
const RANK = {urgent:0, open:1, before:2, tbd:3, closed:4};
let events = [], brand = 'すべて', tab = 'now', openId = null;
let fOpen = false;   // 絞り込みパネルの開閉（スマホ）
let meta = null;   // meta.json（スナイパーが最後に確認した日時）
let view = localStorage.getItem('imas_portal_view_v1') === 'dates' ? 'dates' : 'apply', dtab = 'upcoming';   // 表示: 受付状況 / 公演日順
let gmode = localStorage.getItem('imas_portal_mode_v1') === 'pair' ? 'pair' : 'solo';   // 基本の参戦スタイル
let us = JSON.parse(localStorage.getItem(KEY) || '{}');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const me = id => us[id] || (us[id] = {applied:false, status:'未申込', memo:''});
const save = () => localStorage.setItem(KEY, JSON.stringify(us));

/* ---- 受付状態 ---- */
const ms = v => v ? new Date(v).getTime() : null;
function phase(ev) {
  const n = Date.now(), s = ms(ev.applyStartDate), e = ms(ev.deadline);
  if (e && e < n) return 'closed';

/** 参戦予定（当選・入手した公演）を、公演1つずつの一覧にする。終わった公演は除く */

/* ---- カレンダー用ファイル（.ics）：参戦予定をまとめて登録 ---- */
const CAL_KEY = 'imas_portal_cal_v1';   // 一度ファイルに書き出した公演（次回は「新しい公演だけ」を選べるように）
const calDone = () => { try { return new Set(JSON.parse(localStorage.getItem(CAL_KEY) || '[]')); } catch (_) { return new Set(); } };

const LIVE_HOURS = 3;   // 終演時刻は公式に載っていないことが多いので、開演から3時間で入れる
function icsText(list) {
  const escT = v => String(v || '').replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const fold = line => {   // 1行75バイトまで（日本語が途中で切れないよう、文字単位で折り返す）

    const startD = x.date && at ? new Date(`${x.date}T${at}:00+09:00`) : null;

      ? [`DTSTART:${utc(startD)}`, `DTEND:${utc(new Date(+startD + LIVE_HOURS * 36e5))}`]

/* ---- 動き：数字のカウントアップ（Motion Primitives の AnimatedNumber に相当） ---- */
const RM = typeof matchMedia === 'function' ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: true };

  if (RM.matches || from === to) { el.textContent = to; return; }
  const t0 = performance.now(), dur = 700 + Math.min(Math.abs(to - from), 30) * 10;
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    el.textContent = Math.round(from + (to - from) * e); if (k < 1 && el.dataset.v == to) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
/* ---- 動き：一覧が切り替わったとき、カードを上から順にふわっと出す ---- */

/* ---- 動き：カードのスポットライト（カーソル位置を CSS 変数で渡すだけ） ---- */

/* ---- 詳細パネル：状況に合わせて、主役と並び順を変える ---- */

/** あなたの状況: won 参戦予定 / waiting 当落待ち / skipped 見送り / lost 落選 / ended 受付終了 / before 受付前 / apply 受付中 */
function userMode(ev) {
  const v = dstats(ev), ph = phase(ev);
  if (anyWon(ev)) return 'won';
  if (v.includes('当落待ち⏳')) return 'waiting';
  if (allSkip(ev)) return 'skipped';
  if (v.some(x => x === '落選💦' || x === '入手できず')) return 'lost';
  if (ph === 'closed') return 'ended';
  if (ph === 'before') return 'before';
  return 'apply';
}
function nextSlot(ev) {   // まだ終わっていない受付枠のうち、いちばん早いもの
  return (ev.slots || []).filter(s => phase({applyStartDate: s.start, deadline: s.end}) !== 'closed').sort((a, b) => (ms(a.start) || 0) - (ms(b.start) || 0))[0] || null;
}
function slotRange(sl) { return sl.start && sl.end ? `${fmt(ms(sl.start))} 〜 ${fmt(ms(sl.end))}` : sl.start ? `${fmt(ms(sl.start))} 〜` : sl.end ? `〜 ${fmt(ms(sl.end))}` : '日時は未定'; }

/** 「次にやること」: 今の状況で、いちばん大事な1つを、大きく見せる */
function nextCard(ev, mode, p, cals) {
  const off = ev.officialUrl ? ev.officialUrl : '';
  const act = (k, label) => cals[k] ? [{ label, href: cals[k] }] : [];
  const go = (label) => off ? { label, href: off } : null;
  const ns = (mode === 'lost' || mode === 'ended') ? nextSlot(ev) : null;
  if (mode === 'won') {
    const merchSite = !isPastEv(ev) && (ev.merch || []).find(m => m.kind === '会場物販' && m.url);
    return { tone: 'ok', title: '参戦予定です', sub: `${dateRange(ev)}${ev.venue ? ' ・ ' + ev.venue : ''}`,
      actions: [...act('perf', '公演日をGoogleカレンダーに登録'), ...(merchSite ? [{ label: 'デジタル注文書を開く ↗', href: merchSite.url }] : [])],
      primary: ev.mapUrl ? { label: '会場の地図を開く', icon: 'map', href: ev.mapUrl } : go('公式ページを開く') };
  }
  if (mode === 'waiting') return { tone: 'wait', title: '当落発表を待っています', sub: lotLine(ev) || '発表日は公式ページで確認してください', actions: act('lottery', '当落発表日をGoogleカレンダーに登録'), primary: go('公式ページで結果を確認する') };
  if (mode === 'skipped') return { tone: 'mute', title: '見送りにしています', sub: '気が変わったら、下の「あなたの記録」で戻せます', actions: [], primary: null };
  if (ns) return { tone: 'go', title: '次の受付があります', sub: `${ns.name} ・ ${slotRange(ns)}`, actions: [], primary: go('公式ページを開く') };
  if (mode === 'lost') return { tone: 'mute', title: '今回は残念でした', sub: '追加の受付があるかは、公式ページで確認できます', actions: [], primary: go('公式ページを開く') };
  if (mode === 'ended') return { tone: 'mute', title: '受付は終了しました', sub: '追加の受付があるかは、公式ページで確認できます', actions: [], primary: go('公式ページを開く') };
  if (mode === 'before') return { tone: 'go', title: p.remain || '受付はこれから', sub: `${ev.phase ? ev.phase + ' ・ ' : ''}${p.range}`, actions: [...act('start', '受付開始をGoogleカレンダーに登録'), ...act('deadline', '締切をGoogleカレンダーに登録')].slice(0, 1), primary: go('公式ページを開く') };
  if (p.ph === 'tbd' && !ev.phase) return { tone: 'mute', title: '受付情報はまだありません', sub: '公式ページで最新情報を確認してください', actions: [], primary: go('公式ページを開く') };
  return { tone: p.urgent ? 'urgent' : 'go', title: p.urgent ? p.remain : (p.remain ? `受付中 ・ ${p.remain}` : '受付中'), sub: `${ev.phase ? ev.phase + ' ・ ' : ''}${p.range}`, actions: act('deadline', '締切をGoogleカレンダーに登録'), primary: go('公式ページで申し込む') };
}

/** 折りたたみの項目。開閉の初期値は状況で決め、手で開閉したら、その状態を覚える */
function acc(ev, key, title, hint, inner, def) {
  if (!inner) return '';
  const k = `${ev.id}|${key}`, open = k in secOpen ? secOpen[k] : def;
  return `<details class="acc" data-k="${esc(k)}" ${open ? 'open' : ''}><summary><span class="at">${title}</span><span class="ah">${esc(hint || '')}</span></summary><div class="ab">${inner}</div></details>`;
}

      <details class="acc mini" data-k="${esc(perKey)}" ${perOpen ? 'open' : ''}><summary><span class="at">${ks.length > 1 ? '公演ごとの記録' : '連番の設定'}</span><span class="ah">${esc(perHint)}</span></summary><div class="ab">${modeBar(ev)}${dayBlock(ev)}</div></details>

  $('sheet').classList[next.primary ? 'add' : 'remove']('hascta');   // 下の固定ボタンがあるときは、余白をなくして、画面の下に密着させる
  $('memo').oninput = e => { me(id).memo = e.target.value; save(); };
}

/* ---- 取り消し（トースト） ---- */
let toastTimer, undoFn = null;
function hideToast() { clearTimeout(toastTimer); const t = $('toast'); t.classList.remove('on'); t.innerHTML = ''; undoFn = null; }
function toast(msg, undo, ms = 2500) {
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-undo>元に戻す</button>' : ''}`;
  undoFn = undo || null;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, ms);
}
const ttl = ev => ev.title.length > 16 ? ev.title.slice(0, 16) + '…' : ev.title;
const skipNote = ev => allSkip(ev) ? '。上の「見送り」タブにあります' : '';
function allMsg(ev) {
  const c = common(ev);
  if (c === '未申込') return `「${ttl(ev)}」の状態を解除しました`;
  return `「${ttl(ev)}」を${LBL[c] || c}にしました${c === '見送り' ? skipNote(ev) : ''}`;
}
function dayMsg(ev, k) {
  const v = dget(me(ev.id), k);
  return v === '未申込' ? `${kshort(k)} を未申込に戻しました` : `${kshort(k)} を${LBL[v] || v}にしました${v === '見送り' ? skipNote(ev) : ''}`;
}
function act(ev, fn, msgFn) {   // 変更 → 保存 → 再描画 → 取り消しトースト
  me(ev.id);
  const snap = JSON.stringify(us[ev.id]);
  fn(); save(); render();
  toast(msgFn(), () => { us[ev.id] = JSON.parse(snap); save(); render(); toast('元に戻しました', null, 2500); });
}

/* ---- 記録の共有リンク ----
   自分の記録（公演ごとの状態・メモ）を、URLの「#s=…」より後ろに入れる。サーバーには送らない・保存しない。
   受け取った人は、内容を確認して「空欄だけ補う」か「上書き」で取り込める。連番の名義（自分／連番者）と、ソロ・連番の設定は含めない */
const VALID_ST = new Set(Object.keys(LBL));
const fresh = v => !v || v === '未申込';
const toB64u = u8 => { let t = ''; for (let i = 0; i < u8.length; i += 8192) t += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const fromB64u = t => { const b = atob(t.replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
async function packShare(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream !== 'undefined') { try { return 'z' + toB64u(new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())); } catch (_) {} }
  return 'j' + toB64u(raw);
}
async function unpackShare(str) {
  const bytes = fromB64u(str.slice(1));
  const raw = str[0] === 'z' ? new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()) : bytes;
  return JSON.parse(new TextDecoder().decode(raw));
}
function collectShare(withMemo) {
  const e = {};
  for (const ev of events) {
    const st = us[ev.id]; if (!st) continue;
    const d = {}; dkeys(ev).forEach(k => { const v = dget(st, k); if (!fresh(v)) d[k] = v; });
    const m = withMemo ? (st.memo || '').trim().slice(0, 300) : '';
    if (!Object.keys(d).length && fresh(st.status) && !m) continue;
    e[ev.id] = { s: common(ev) || '未申込', ...(Object.keys(d).length ? { d } : {}), ...(m ? { m } : {}) };
  }
  return { v: 1, e };
}
function cleanShared(x) {   // URLから来た値は、そのまま信用せず、知っているイベント・公演・状態だけを通す
  const out = {};
  if (!x || x.v !== 1 || !x.e || typeof x.e !== 'object') return out;
  for (const [id, sh] of Object.entries(x.e).slice(0, 300)) {
    const ev = events.find(v => v.id === id); if (!ev || !sh || typeof sh !== 'object') continue;
    const ks = new Set(dkeys(ev)), o = { s: VALID_ST.has(sh.s) ? sh.s : '未申込', d: {} };
    for (const [k, v] of Object.entries(sh.d || {})) if (ks.has(k) && VALID_ST.has(v)) o.d[k] = v;
    if (typeof sh.m === 'string' && sh.m.trim()) o.m = sh.m.slice(0, 300);
    if (!fresh(o.s) || Object.keys(o.d).length || o.m) out[id] = o;
  }
  return out;
}
function mergeShared(shared, overwrite) {
  for (const [id, sh] of Object.entries(shared)) {
    const ev = events.find(v => v.id === id); if (!ev) continue;
    const st = me(id); st.days = st.days || {};
    if (overwrite) {   // このイベントの記録を、受け取った内容に置き換える（受け取った中に無いイベントは、そのまま）
      st.status = sh.s; st.days = {};
      for (const [k, v] of Object.entries(sh.d)) st.days[k] = { status: v };
      if (sh.m !== undefined) st.memo = sh.m;
    } else {            // 自分の記録が空欄のところだけ、受け取った内容で補う
      if (fresh(st.status) && Object.keys(sh.d).length === 0) st.status = sh.s;
      for (const [k, v] of Object.entries(sh.d)) { if (fresh(st.days[k] && st.days[k].status)) st.days[k] = { ...(st.days[k] || {}), status: v }; }
      if (!(st.memo || '').trim() && sh.m) st.memo = sh.m;
    }
    mat(ev); sync(ev, st);
  }
}
const shareSumm = (ev, o) => `${esc(ttl(ev))}：${Object.keys(o.d).length ? Object.entries(o.d).map(([k, v]) => `${esc(kshort(k))} ${esc(LBL[v])}`).join('・') : esc(LBL[o.s] || '')}${o.m ? '（メモあり）' : ''}`;

const dlgOpen = () => !$('dlgb').hidden;

function syncInert() {   // パネルやダイアログを開いている間は、後ろの画面にフォーカスが移らないようにする

async function openShareDlg() {
  const data = collectShare(shareMemo), n = Object.keys(data.e).length;

  const url = `${location.origin}${location.pathname}#s=${await packShare(data)}`;

    <div class="dact"><button class="btn" data-dlg="copy">リンクをコピー</button>${navigator.share ? '<button class="btn" data-dlg="native">共有する…</button>' : ''}<button class="btn ghost" data-dlg="close">閉じる</button></div>`);
}
function showImportDlg(shared) {
  pendingShare = shared;
  const rows = Object.entries(shared).map(([id, o]) => [events.find(v => v.id === id), o]).filter(([ev]) => ev);
  showDlg(`<h3>共有された記録を受け取りました</h3>
    <p>${rows.length}件のイベントの記録が入っています。</p>
    <ul>${rows.slice(0, 8).map(([ev, o]) => `<li>${shareSumm(ev, o)}</li>`).join('')}${rows.length > 8 ? `<li>…ほか${rows.length - 8}件</li>` : ''}</ul>
    <p class="sub">取り込んだあとも、トーストの「元に戻す」で取り消せます。受け取った中に無いイベントは、変わりません。</p>
    <div class="dact"><button class="btn" data-dlg="fill">自分の記録を残して、空欄だけ補う</button><button class="btn" data-dlg="over">相手の記録で上書きする</button><button class="btn ghost" data-dlg="close">取り込まない</button></div>`);
}
function applyImport(overwrite) {
  if (!pendingShare) return;
  const shared = pendingShare, snap = JSON.stringify(us), n = Object.keys(shared).length;
  mergeShared(shared, overwrite); save(); closeDlg(); render();
  toast(`${n}件の記録を${overwrite ? '上書きで' : '空欄だけ'}取り込みました`, () => { us = JSON.parse(snap); save(); render(); toast('元に戻しました', null, 2500); }, 6000);
}
async function dlgAction(a) {
  if (a === 'close') { closeDlg(); return; }
  if (a === 'fill' || a === 'over') { applyImport(a === 'over'); return; }
  const url = ($('dlgurl') || {}).textContent || '';
  if (a === 'copy') {
    const done = () => toast('リンクをコピーしました', null, 2000);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => prompt('このリンクをコピーしてください', url)); else prompt('このリンクをコピーしてください', url);
  }
  if (a === 'native') { try { await navigator.share({ title: 'アイマスライブ情報ポータル 私の記録', url }); } catch (_) {} }
}
async function importFromHash() {
  const hm = (location.hash || '').match(/^#s=(.+)$/); if (!hm) return false;
  if (history.replaceState) history.replaceState(null, '', location.pathname + location.search);   // 再読み込みで、また聞かれないように
  try { const shared = cleanShared(await unpackShare(hm[1])); if (Object.keys(shared).length) showImportDlg(shared); else toast('共有された記録を読み取れませんでした（取り込める記録がありません）', null, 4000); }
  catch (_) { toast('共有リンクを読み取れませんでした。リンクが途中で切れていないか確認してください', null, 4500); }
  return true;
}

/* ---- 操作 ---- */
function openSheet(id, push = true) {
  fOpen = false; drawFilter();
  openId = id; renderSheet(id);
  const sh = $('sheet'); sh.scrollTop = 0; syncInert(); $('back').classList.add('on'); sh.classList.add('on');
  setTimeout(() => { const x = sh.querySelector('[data-close]'); if (x) x.focus(); }, 60);
  if (push && typeof history !== 'undefined' && history.pushState) {   // 戻るボタンで、パネルを閉じられるようにする
    const url = '#e=' + encodeURIComponent(id);
    if (history.state && history.state.sheet) history.replaceState({ sheet: id }, '', url); else history.pushState({ sheet: id }, '', url);
  }
}
function doClose() { const id = openId; openId = null; $('back').classList.remove('on'); $('sheet').classList.remove('on'); syncInert(); const el = [...document.querySelectorAll('.card,.todo-item,.drow')].find(x => (x.dataset.id || x.dataset.open) === id); if (el) el.focus(); }
function closeSheet() {
  if (openId && typeof history !== 'undefined' && history.state && history.state.sheet) { history.back(); return; }   // 戻るボタンと同じ動き（popstateで閉じる）
  doClose();
  if (typeof history !== 'undefined' && history.replaceState && typeof location !== 'undefined' && /^#e=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
}
addEventListener('popstate', () => { if (openId) doClose(); });
function shareLink() {   // このイベントのURLをコピー
  if (!openId) return;
  const url = `${location.origin}${location.pathname}#e=${encodeURIComponent(openId)}`;
  const done = () => toast('リンクをコピーしました', null, 2000), ask = () => prompt('このリンクをコピーしてください', url);
  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, ask); else ask();
}

document.addEventListener('click', e => {
  const da = e.target.closest('[data-dlg]'); if (da) { dlgAction(da.dataset.dlg); return; }
  const ts = e.target.closest('[data-theme-set]'); if (ts) { theme = ts.dataset.themeSet; try { localStorage.setItem(THEME_KEY, theme); } catch (_) {} applyTheme(); openSettings(); return; }
  const so = e.target.closest('[data-settings]'); if (so) { openSettings(so.dataset.settings); return; }
  const sg = e.target.closest('[data-go]');
  if (sg) {
    if (sg.dataset.go === 'going') { view = 'dates'; dtab = 'going'; } else { view = 'apply'; tab = 'now'; }
    localStorage.setItem('imas_portal_view_v1', view); render();
    const t = document.querySelector('.tools'); if (t) scrollTo({ top: t.offsetTop - 4, behavior: 'smooth' });
    return;
  }
  const ic = e.target.closest('[data-ics]'); if (ic) { downloadIcs(ic.dataset.ics); return; }
  if (e.target.closest('[data-calopen]')) { openCalDlg(); return; }
  if (e.target === $('dlgb')) { closeDlg(); return; }
  if (e.target.closest('[data-sharestate]')) { fOpen = false; drawFilter(); openShareDlg(); return; }
  if (e.target.closest('#fbtn')) { fOpen = !fOpen; drawFilter(); return; }
  if (fOpen && !e.target.closest('#fpanel')) { fOpen = false; drawFilter(); }   // パネルの外をタップしたら閉じる（そのタップの操作は、そのまま行う）
  const sm = e.target.closest('details.acc > summary');   // 折りたたみ：手で開閉した状態を覚える（ブラウザ標準の開閉は、そのまま動く）
  if (sm) { const d = sm.parentElement; secOpen[d.dataset.k] = !d.open; return; }
  if (e.target.closest('[data-share]')) { shareLink(); return; }
  if (e.target.closest('[data-undo]')) { const f = undoFn; hideToast(); if (f) f(); return; }
  if (e.target.closest('[data-reset]')) { brand = 'すべて'; $('q').value = ''; render(); return; }
  const sb = e.target.closest('.seg button');
  if (sb) {
    e.stopPropagation();
    const box = sb.parentElement, ev = events.find(x => x.id === box.dataset.id), v = sb.dataset.st, k = box.dataset.day;
    if (ev) { if (k !== undefined) act(ev, () => setDay(ev, k, v), () => dayMsg(ev, k)); else act(ev, () => setAll(ev, v), () => allMsg(ev)); }   // もう一度押すと解除
    return;
  }
  const bb = e.target.closest('.by button');
  if (bb) { const box = bb.parentElement, ev = events.find(x => x.id === box.dataset.id), k = box.dataset.day; if (ev) act(ev, () => { mat(ev).days[k].by = bb.dataset.by; }, () => `${kshort(k)} の名義を${bb.dataset.by}にしました`); return; }
  const dc = e.target.closest('.dchip');
  if (dc) { const ev = events.find(x => x.id === dc.dataset.id), k = dc.dataset.day; if (ev) act(ev, () => cycleDay(ev, k), () => dayMsg(ev, k)); return; }
  const gm = e.target.closest('[data-gmode]');
  if (gm) { gmode = gm.dataset.gmode; localStorage.setItem('imas_portal_mode_v1', gmode); render(); return; }
  const mb = e.target.closest('.mode button');
  if (mb) { const ev = events.find(x => x.id === mb.parentElement.dataset.id); if (ev) { const st = me(ev.id); if (mb.dataset.mode === gmode) delete st.mode; else st.mode = mb.dataset.mode; save(); render(); } return; }
  const vw = e.target.closest('[data-view]'); if (vw) { view = vw.dataset.view; localStorage.setItem('imas_portal_view_v1', view); render(); return; }
  const dt = e.target.closest('[data-dtab]'); if (dt) { dtab = dt.dataset.dtab; render(); return; }
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); return; }
  const b = e.target.closest('[data-brand]'); if (b) { brand = b.dataset.brand; fOpen = false; render(); return; }
  if (e.target.closest('[data-close]') || e.target === $('back')) { closeSheet(); return; }
  const o = e.target.closest('[data-open]') || e.target.closest('.card') || e.target.closest('.drow');
  if (o) openSheet(o.dataset.open || o.dataset.id);
});
$('q').oninput = render;
addEventListener('hashchange', () => { if (/^#s=/.test(location.hash) && events.length) importFromHash(); });   // 開いたままのタブにリンクを貼ったとき
document.addEventListener('change', e => { if (e.target.matches('[data-dlg-memo]')) { shareMemo = e.target.checked; openShareDlg(); } });
addEventListener('keydown', e => {
  if (e.key === 'Escape' && dlgOpen()) { closeDlg(); return; }
  if (e.key === 'Escape') { if (fOpen) { fOpen = false; drawFilter(); const fb = $('fbtn'); if (fb) fb.focus(); return; } closeSheet(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && (e.target.classList.contains('card') || e.target.classList.contains('drow'))) { e.preventDefault(); openSheet(e.target.dataset.id); }
});

(async () => {
  try {
    const r = await fetch(`./events.json?_=${Date.now()}`);
    if (!r.ok) throw 0;
    const j = await r.json();
    events = Array.isArray(j) ? j : [];
  } catch (_) { events = []; }
  try { const mr = await fetch(`./meta.json?_=${Date.now()}`); if (mr.ok) meta = await mr.json(); } catch (_) {}
  if (!events.length) {
    events = demo();
    $('note').hidden = false;
    $('note').innerHTML = ic('alert') + ' ' + 'events.json を読み込めないため、サンプルを表示しています（index.html と同じフォルダに events.json を置くと本物のデータになります）';
    $('note').style.color = 'var(--warn)';
  }
  render();
  if (typeof location !== 'undefined' && await importFromHash()) return;   // 記録の共有リンク（#s=…）で開いたとき
  if (typeof location !== 'undefined') {   // 共有リンク（#e=イベントID）で開いたとき
    const hm = (location.hash || '').match(/^#e=(.+)$/);
    if (hm) { const id = decodeURIComponent(hm[1]); if (events.some(x => x.id === id)) openSheet(id, false); }
  }
})();
</script>
</body>
