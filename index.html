<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アイマス ライブ・イベント情報ポータル</title>
<style>
:root{--bg:#191919;--surface:#202020;--surface2:#2c2c2c;--line:#2f2f2f;--text:#ffffffcf;--muted:#9b9b9b;--accent:#7aa2f7;--ok:#9ece6a;--warn:#f7768e;--gold:#e0af68;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{padding:28px 0 12px}
h1{font-size:22px;font-weight:800;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12px;margin-top:2px}

/* 今やること */
.todo{margin:8px 0 14px;padding:14px;border-radius:var(--r);background:#252525;border:1px solid var(--line)}
.todo h2{font-size:14px;margin-bottom:10px}
.todo-list{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.todo-item{flex:0 0 min(260px,78%);scroll-snap-align:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.todo-item b{display:block;font-size:13px;line-height:1.4;margin-bottom:2px}
.todo-item span{font-size:12px;color:var(--warn)}
.todo-item.soon span{color:var(--accent)}

/* 絞り込み */
.tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 10px;margin-bottom:6px}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);color:var(--muted);font-weight:600;white-space:nowrap}
.tab b{margin-left:5px;color:var(--text)}
.tab.on{background:rgba(122,162,247,.15);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tab.on b{color:var(--accent)}
.chip{flex:none;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12px}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.search{width:100%;margin-top:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px}

/* カード */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;padding-bottom:60px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px 20px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:6px;transition:background .15s}
.card:hover{background:var(--surface2)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--b)}
.card.closed .body{opacity:.5}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-right:4px;color:#0c1030}
.badge{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.badge.open{background:rgba(158,206,106,.18);color:var(--ok)}
.badge.urgent{background:rgba(247,118,142,.2);color:var(--warn)}
.badge.before{background:rgba(122,162,247,.15);color:var(--accent)}
.badge.closed,.badge.tbd{background:#2c2c2c;color:var(--muted)}
.card h2{font-size:17px;line-height:1.35;font-weight:800}
.phase{color:var(--muted);font-size:12px}
.range{font-size:14px;font-weight:600}
.remain{font-size:12px;color:var(--muted)}
.remain.urgent{color:var(--warn);font-weight:800}
.meta{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px;margin-top:8px;background:var(--bg);padding:3px;border-radius:10px}
.seg button{min-height:40px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:rgba(122,162,247,.2);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg button.on[data-st^="当選"]{background:rgba(158,206,106,.18);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.seg button.on[data-st^="落選"]{background:rgba(247,118,142,.15);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.seg button.on[data-st="入手🎫"]{background:rgba(158,206,106,.18);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.seg button.on[data-st="入手できず"]{background:rgba(247,118,142,.15);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.seg button.on[data-st="見送り"]{background:#2c2c2c;color:var(--muted);box-shadow:inset 0 0 0 1px #555}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 12px}

/* 詳細シート */
.back{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:51;background:var(--surface);overflow-y:auto;transition:transform .25s;padding:18px 18px calc(32px + env(safe-area-inset-bottom))}
.sheet h3{font-size:20px;line-height:1.35;margin:8px 0 12px}
.sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.sec h4{font-size:13px;color:var(--muted);margin-bottom:8px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.btn{display:block;text-align:center;padding:12px;border-radius:8px;font-weight:700;background:rgba(122,162,247,.15);border:1px solid var(--accent);color:var(--accent);margin-top:8px}
.btn.sp{background:rgba(224,175,104,.15);color:var(--gold);border-color:var(--gold)}
.sched{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px}
.sched summary{cursor:pointer;color:var(--muted);font-size:12px;margin:6px 0}
.memo{width:100%;min-height:72px;margin-top:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.x{position:absolute;top:10px;right:12px;font-size:20px;padding:6px 10px;color:var(--muted)}
@media(max-width:767px){
  .sheet{left:0;right:0;bottom:0;height:90dvh;border-radius:20px 20px 0 0;transform:translateY(100%)}
  .sheet.on{transform:none}
}
@media(min-width:768px){
  .sheet{top:0;right:0;bottom:0;width:520px;transform:translateX(100%);box-shadow:-12px 0 32px rgba(0,0,0,.5)}
  .sheet.on{transform:none}
  .search{max-width:380px;margin-top:0;position:absolute;right:0;top:8px}
  .tools{position:sticky}
  .tools .wrap-in{position:relative}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎤 アイマス ライブ・イベント情報ポータル</h1>
    <p class="sub" id="note">応募状況とメモは、このブラウザに自動保存されます</p>
  </header>
  <section class="todo" id="todo" hidden></section>
  <div class="tools"><div class="wrap-in">
    <div class="row" id="tabs"></div>
    <div class="row" id="brands" style="margin-top:8px"></div>
    <input class="search" id="q" type="search" placeholder="ライブ名・会場・出演者で検索">
  </div></div>
  <main class="grid" id="grid"></main>
</div>
<div class="back" id="back"></div>
<aside class="sheet" id="sheet" aria-label="イベント詳細"></aside>

<script>
const KEY = 'imas_portal_user_state_v1';
const BR = {'765AS':'#ff6b6b','デレマス':'#4aa8ff','ミリオン':'#ffcb3d','シャニマス':'#8fb8ff','SideM':'#33d6b0','学マス':'#ff9f2e','ヴイアラ':'#b99cff'};
const BRANDS = ['すべて', ...Object.keys(BR)];
// 抽選系（先行・一般抽選・リセールなど）と先着で、ボタンの言葉を切り替える
const ST_LOT  = [['当落待ち⏳','当落待ち'],['当選🎉','当選'],['落選💦','落選'],['見送り','見送り']];
const ST_FCFS = [['入手🎫','入手'],['入手できず','入手できず'],['見送り','見送り']];
const DONE = ['当落待ち⏳','当選🎉','落選💦','入手🎫','入手できず'];   // 応募・購入に動いたもの
const isFcfs = ev => /先着/.test(ev.phase || '');
const pending = st => !DONE.includes(st.status) && st.status !== '見送り';   // まだ動いていない

const TABS = [['now','今応募できる'],['before','受付前'],['mine','応募済み'],['closed','終了'],['all','すべて']];
const RANK = {urgent:0, open:1, before:2, tbd:3, closed:4};
let events = [], brand = 'すべて', tab = 'now', openId = null;
let us = JSON.parse(localStorage.getItem(KEY) || '{}');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const me = id => us[id] || (us[id] = {applied:false, status:'未申込', memo:''});
const save = () => localStorage.setItem(KEY, JSON.stringify(us));

/* ---- 受付状態 ---- */
const ms = v => v ? new Date(v).getTime() : null;
function phase(ev) {
  const n = Date.now(), s = ms(ev.applyStartDate), e = ms(ev.deadline);
  if (e && e < n) return 'closed';
  if (s && s > n) return 'before';
  if (e && e - n <= 3*864e5) return 'urgent';
  return (s || e) ? 'open' : 'tbd';
}
const fmtJ = new Intl.DateTimeFormat('ja-JP', {timeZone:'Asia/Tokyo', month:'numeric', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
function fmt(v) {
  const p = Object.fromEntries(fmtJ.formatToParts(new Date(v)).map(x => [x.type, x.value]));
  return `${p.month}/${p.day}(${p.weekday}) ${p.hour}:${p.minute}`;
}
function left(t) {
  const d = t - Date.now();
  if (d <= 0) return '';
  const h = d / 36e5;
  return h < 1 ? 'あと1時間未満' : h < 24 ? `あと${Math.floor(h)}時間` : `あと${Math.floor(d/864e5)}日`;
}
function period(ev) {
  const ph = phase(ev), s = ms(ev.applyStartDate), e = ms(ev.deadline);
  const txt = {open:'受付中', urgent:'締切間近', before:'受付前', closed:'受付終了', tbd:'未定'}[ph];
  let range = '受付期間は未定', remain = '', urgent = ph === 'urgent';
  if (s && e) range = `${fmt(s)} 〜 ${fmt(e)}`;
  else if (s) range = `${fmt(s)} 〜`;
  else if (e) range = `〜 ${fmt(e)}`;
  if (ph === 'before') remain = `受付開始まで ${left(s)}`;
  else if (ph === 'open' || ph === 'urgent') remain = e ? `締切まで ${left(e)}` : '締切は公式で確認';
  return {ph, txt, range, remain, urgent};
}
function calUrl(ev) {
  const end = ev.deadline ? new Date(ev.deadline) : null;
  if (!end || isNaN(end) || end < new Date()) return '';
  const f = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const p = new URLSearchParams({action:'TEMPLATE', text:`【申込締切】${ev.title}${ev.phase ? `（${ev.phase}）` : ''}`, dates:`${f(new Date(end - 18e5))}/${f(end)}`, details:ev.officialUrl || '', location:ev.venue || ''});
  return 'https://calendar.google.com/calendar/render?' + p;
}

/* ---- 部品 ---- */
const stripe = ev => {
  const c = (ev.brands || []).map(b => BR[b]).filter(Boolean);
  return c.length > 1 ? `linear-gradient(${c.join(',')})` : (c[0] || '#555a82');
};
const tags = ev => (ev.brands || []).map(b => `<span class="tag" style="background:${BR[b] || '#555a82'}">${esc(b)}</span>`).join('');
const seg = (ev, cur) => { const set = isFcfs(ev) ? ST_FCFS : ST_LOT; return `<div class="seg" data-id="${esc(ev.id)}" style="--n:${set.length}">${set.map(([v, l]) => `<button data-st="${v}" class="${cur === v ? 'on' : ''}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div>`; };

function matchTab(ev, ph, st) {
  if (tab === 'now') return (ph === 'open' || ph === 'urgent') && st.status !== '見送り';
  if (tab === 'before') return ph === 'before' && st.status !== '見送り';
  if (tab === 'mine') return DONE.includes(st.status);
  if (tab === 'closed') return ph === 'closed';
  return true;
}

/* ---- 描画 ---- */
function render() {
  const q = $('q').value.trim().toLowerCase();
  const today = new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Tokyo'});
  const base = events.filter(ev => {
    if (brand !== 'すべて' && !(ev.brands || []).includes(brand)) return false;
    if (!q) return true;
    return [ev.title, ev.venue, ev.phase, me(ev.id).memo, ...(ev.brands || []), ...(ev.schedules || []).flatMap(s => s.castNames || [])].join(' ').toLowerCase().includes(q);
  });
  const cnt = {};
  TABS.forEach(([k]) => { const t = tab; tab = k; cnt[k] = base.filter(ev => matchTab(ev, phase(ev), me(ev.id))).length; tab = t; });
  $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${l}<b>${cnt[k]}</b></button>`).join('');
  $('brands').innerHTML = BRANDS.map(b => `<button class="chip ${brand === b ? 'on' : ''}" data-brand="${b}">${b}</button>`).join('');

  const list = base.filter(ev => {
    const ph = phase(ev), st = me(ev.id);
    if (!matchTab(ev, ph, st)) return false;
    const end = ev.eventDateEnd || ev.eventDateStart || '';
    return !(end && end < today && tab !== 'all' && tab !== 'mine');
  }).sort((a, b) => {
    const pa = phase(a), pb = phase(b);
    const k = (ev, p) => p === 'before' ? ms(ev.applyStartDate) : p === 'closed' ? -ms(ev.deadline) : (ms(ev.deadline) || 8.64e15);
    return RANK[pa] - RANK[pb] || k(a, pa) - k(b, pb);
  });

  $('grid').innerHTML = list.length ? list.map(ev => {
    const p = period(ev), st = me(ev.id);
    const d = ev.eventDateStart ? (ev.eventDateEnd && ev.eventDateEnd !== ev.eventDateStart ? `${ev.eventDateStart} 〜 ${ev.eventDateEnd.slice(5)}` : ev.eventDateStart) : '未定';
    return `<article class="card ${p.ph === 'closed' || st.status === '見送り' ? 'closed' : ''}" data-id="${esc(ev.id)}" style="--b:${stripe(ev)}">
      <div class="body">
        <div class="c-top"><div>${tags(ev)}</div><span class="badge ${p.ph}">${p.txt}</span></div>
        <h2>${esc(ev.icon || '🎤')} ${esc(ev.title)}</h2>
        <div class="phase">${esc(ev.phase || '')}</div>
        <div class="range">${esc(p.range)}</div>
        <div class="remain ${p.urgent ? 'urgent' : ''}">${esc(p.remain)}</div>
        <div class="meta">📅 ${esc(d)}　🏟️ ${esc(ev.venue || '未定')}</div>
      </div>
      ${seg(ev, st.status)}
    </article>`;
  }).join('') : `<div class="empty">${events.length ? 'この条件のイベントはありません' : 'events.json を読み込めませんでした。index.html と同じ場所に置いてあるか確認してください'}</div>`;

  renderTodo();
  if (openId) renderSheet(openId);
}

function renderTodo() {
  const n = Date.now();
  const items = events.map(ev => {
    const ph = phase(ev), st = me(ev.id), s = ms(ev.applyStartDate);
    if (ph === 'urgent' && pending(st)) return {ev, k:0, t:`締切 ${left(ms(ev.deadline))}`, c:''};
    if (ph === 'before' && s - n <= 48*36e5 && pending(st)) return {ev, k:1, t:`受付開始 ${fmt(s)}`, c:'soon'};
    return null;
  }).filter(Boolean).sort((a, b) => a.k - b.k);
  const el = $('todo');
  el.hidden = !items.length;
  if (items.length) el.innerHTML = `<h2>⏰ 今チェックしたいもの（${items.length}件）</h2><div class="todo-list">${items.map(i => `<button class="todo-item ${i.c}" data-open="${esc(i.ev.id)}"><b>${esc(i.ev.title)}</b><span>${esc(i.ev.phase || '')}　${esc(i.t)}</span></button>`).join('')}</div>`;
}

function renderSheet(id) {
  const ev = events.find(x => x.id === id);
  if (!ev) return;
  const st = me(id), p = period(ev), cal = calUrl(ev);
  $('sheet').innerHTML = `<button class="x" data-close aria-label="閉じる">✕</button>
    <div>${tags(ev)}</div>
    <h3>${esc(ev.icon || '🎤')} ${esc(ev.title)}</h3>
    ${seg(ev, st.status)}
    <textarea class="memo" id="memo" placeholder="自分用メモ（例：Day1申込済、ホテル確保）">${esc(st.memo)}</textarea>
    <div class="sec"><h4>受付</h4><dl class="kv">
      <dt>受付枠</dt><dd>${esc(ev.phase || 'ー')}</dd>
      <dt>状態</dt><dd><span class="badge ${p.ph}">${p.txt}</span></dd>
      <dt>受付期間</dt><dd>${esc(p.range)}<br><span class="remain ${p.urgent ? 'urgent' : ''}">${esc(p.remain)}</span></dd>
      <dt>当落発表</dt><dd>${esc(ev.lotteryDate || 'ー')}</dd></dl>
      ${ev.officialUrl ? `<a class="btn" href="${esc(ev.officialUrl)}" target="_blank" rel="noopener">公式ページを開く</a>` : ''}
      ${cal ? `<a class="btn" href="${esc(cal)}" target="_blank" rel="noopener">締切をGoogleカレンダーに登録</a>` : ''}
    </div>
    <div class="sec"><h4>会場</h4><dl class="kv">
      <dt>会場</dt><dd>${esc(ev.venue || '未定')}</dd>
      ${ev.nearestStation ? `<dt>最寄り駅</dt><dd>${esc(ev.nearestStation)}</dd>` : ''}
      <dt>リンク</dt><dd>${ev.mapUrl ? `<a href="${esc(ev.mapUrl)}" target="_blank" rel="noopener">地図</a>` : ''}　${ev.accessUrl ? `<a href="${esc(ev.accessUrl)}" target="_blank" rel="noopener">アクセス</a>` : ''}</dd></dl></div>
    <div class="sec"><h4>公演日程とペンライト</h4>${(ev.schedules || []).map(sc => {
      const sp = ev.isSpecialColor || (sc.penlightUrl || '').includes('special=1'), n = sc.castCount || (sc.castNames || []).length;
      return `<div class="sched"><b>${esc(sc.label)}</b>
        ${(sc.castNames || []).length ? `<details><summary>出演キャスト（${sc.castNames.length}名）</summary>${esc(sc.castNames.join(' / '))}</details>` : ''}
        ${sc.penlightUrl ? `<a class="btn ${sp ? 'sp' : ''}" href="${esc(sc.penlightUrl)}" target="_blank" rel="noopener">${sp ? '🎨 ペンライト設定を作成（特別カラー）' : '🪄 ペンライト設定を作成'}（${n}名）</a>` : ''}</div>`;
    }).join('') || '<p class="sub">日程は未定です</p>'}</div>`;
  $('memo').oninput = e => { me(id).memo = e.target.value; save(); };
}

/* ---- サンプルデータ（events.json が無い時だけ表示） ---- */
function demo() {
  const d = (h) => new Date(Date.now() + h * 36e5).toISOString();
  const mk = (id, title, brands, phase, s, e, venue) => ({id, icon:'🎤', title, brands, phase, applyStartDate:d(s), deadline:e == null ? '' : d(e), lotteryDate:'', eventDateStart:'2027-02-13', eventDateEnd:'2027-02-14', officialUrl:'https://idolmaster-official.jp/', venue, mapUrl:'', accessUrl:'', nearestStation:'', isSpecialColor:false, schedules:[{label:'Day1: 2027年2月13日(土) 開場15:30 / 開演17:00', castCount:2, castNames:['サンプルA','サンプルB'], penlightUrl:''}]});
  return [
    mk('demo1', 'サンプル：シャニマス ライブ', ['シャニマス'], 'アソビストア会員先行', -240, 40, 'Kアリーナ横浜'),
    mk('demo2', 'サンプル：デレ×ミリ合同', ['デレマス','ミリオン'], '一般発売（先着）', -24, 400, 'IGアリーナ'),
    mk('demo3', 'サンプル：ヴイアラ ライブ', ['ヴイアラ'], 'アソビストア一般会員先行', 20, 300, '愛知芸術劇場'),
    mk('demo4', 'サンプル：学マス ツアー', ['学マス'], '公式リセール', -500, -2, 'Kアリーナ横浜')
  ];
}

/* ---- 操作 ---- */
function openSheet(id) { openId = id; renderSheet(id); $('sheet').scrollTop = 0; $('back').classList.add('on'); $('sheet').classList.add('on'); }
function closeSheet() { openId = null; $('back').classList.remove('on'); $('sheet').classList.remove('on'); }

document.addEventListener('click', e => {
  const sb = e.target.closest('.seg button');
  if (sb) {
    e.stopPropagation();
    const id = sb.parentElement.dataset.id, st = me(id), v = sb.dataset.st;
    st.status = st.status === v ? '未申込' : v;   // もう一度押すと解除
    st.applied = DONE.includes(st.status);
    save(); render(); return;
  }
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); return; }
  const b = e.target.closest('[data-brand]'); if (b) { brand = b.dataset.brand; render(); return; }
  if (e.target.closest('[data-close]') || e.target === $('back')) { closeSheet(); return; }
  const o = e.target.closest('[data-open]') || e.target.closest('.card');
  if (o) openSheet(o.dataset.open || o.dataset.id);
});
$('q').oninput = render;
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

(async () => {
  try {
    const r = await fetch(`./events.json?_=${Date.now()}`);
    if (!r.ok) throw 0;
    const j = await r.json();
    events = Array.isArray(j) ? j : [];
  } catch (_) { events = []; }
  if (!events.length) {
    events = demo();
    $('note').innerHTML = '⚠️ events.json を読み込めないため、サンプルを表示しています（index.html と同じフォルダに events.json を置くと本物のデータになります）';
    $('note').style.color = 'var(--warn)';
  }
  render();
})();
</script>
</body>
