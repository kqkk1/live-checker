name: Sync events.json
# 手動実行。公式サイトもAIも使わず、Notionの今の内容から events.json だけ作り直して反映する（手入力の反映・画面の確認用）
on:
  workflow_dispatch:

permissions:
  contents: write

# チェッカー本体（Imas Ticket Checker）と同時に書き込まないように、同じ名前のグループにする
concurrency:
  group: imas-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Sync from Notion (no scraping, no AI)
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_SLOT_DB_ID: ${{ secrets.NOTION_SLOT_DB_ID }}
          NOTION_SCHEDULE_DB_ID: ${{ secrets.NOTION_SCHEDULE_DB_ID }}
          NOTION_LOG_DB_ID: ${{ secrets.NOTION_LOG_DB_ID }}
          NOTION_MERCH_DB_ID: ${{ secrets.NOTION_MERCH_DB_ID }}
        run: node index.js --sync-only

      - name: Commit and Push events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json meta.json
          git diff --staged --quiet || git commit -m "chore: sync events.json from Notion DB"
          git pull --rebase
          git push
