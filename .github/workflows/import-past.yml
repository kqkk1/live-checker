name: Import past lives
# 過去のライブの取り込み（1回だけ使う）
#  tools/past-lives.json の内容を、NotionのライブDBと公演日程DBに追加し、events.json を作り直す
#  まず「書き込む」をオフのまま実行して、ログで追加される内容を確認 → 問題なければ「書き込む」をオンにして実行
#  同じライブはもう一度作らないので、2回実行しても重複しません
on:
  workflow_dispatch:
    inputs:
      write:
        description: '書き込む（オフ = 確認だけ。Notionには何も書かない）'
        type: boolean
        default: false

permissions:
  contents: write

# 定期のチェッカーと同時に動かないようにする
concurrency:
  group: imas-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
      NOTION_SLOT_DB_ID: ${{ secrets.NOTION_SLOT_DB_ID }}
      NOTION_SCHEDULE_DB_ID: ${{ secrets.NOTION_SCHEDULE_DB_ID }}
      NOTION_LOG_DB_ID: ${{ secrets.NOTION_LOG_DB_ID }}
      NOTION_MERCH_DB_ID: ${{ secrets.NOTION_MERCH_DB_ID }}
      WRITE: ${{ inputs.write }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Import
        run: |
          if [ "$WRITE" = "true" ]; then node tools/import-past.js --write; else node tools/import-past.js; fi

      # 書き込んだときだけ、Notionの今の内容から events.json を作り直して保存する（公式サイトもAIも使わない）
      - name: Rebuild events.json
        if: env.WRITE == 'true'
        run: node index.js --sync-only

      - name: Commit and Push events.json
        if: env.WRITE == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json meta.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: add past lives to events.json"
            git pull --rebase
            git push
          fi
