name: Imas Ticket Checker
on:
  schedule:
    # 毎日UTC 18:00 (日本時間 翌03:00) ＝ 深夜の更新
    - cron: '0 18 * * *'
    # 毎日UTC 04:00 (日本時間 13:00) ＝ お昼の更新
    - cron: '0 4 * * *'
  workflow_dispatch: # 手動実行用
    inputs:
      dry:
        description: 'ドライラン（Notionにもevents.jsonにも書き込まない。試運転用）'
        type: boolean
        default: false
      max:
        description: '（任意）新しい記事を最大この件数だけ処理する。空欄なら全件'
        type: string
        required: false
        default: ''

# GitHub Actions (ボット) がファイルをリポジトリに保存するための権限
permissions:
  contents: write

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Headless Browser
        run: npx playwright install chromium

      - name: Run Script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_SLOT_DB_ID: ${{ secrets.NOTION_SLOT_DB_ID }}
          NOTION_SCHEDULE_DB_ID: ${{ secrets.NOTION_SCHEDULE_DB_ID }}
          NOTION_LOG_DB_ID: ${{ secrets.NOTION_LOG_DB_ID }}
          NOTION_APPLICATION_DB_ID: ${{ secrets.NOTION_APPLICATION_DB_ID }}
          APPLICANTS: ${{ secrets.APPLICANTS }}   # 任意。未設定なら、申込記録の自動作成は行われません
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # 任意。未設定なら、通知は送られません
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY: ${{ inputs.dry }}
          MAX: ${{ inputs.max }}
        run: |
          args=()
          if [ "$DRY" = "true" ]; then args+=(--dry); fi
          if [ -n "$MAX" ]; then args+=("--max=$MAX"); fi
          node index.js "${args[@]}"

      # 生成された events.json を自動でコミット＆プッシュ（ドライランのときは変更なし）
      - name: Commit and Push events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json meta.json
          # 差分がある場合のみコミットしてプッシュする安全な書き方
          git diff --staged --quiet || git commit -m "chore: update events.json from Notion DB"
          git push

      # 失敗したときだけ、Discordに通知（DISCORD_WEBHOOK_URL が未設定なら何もしない）
      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "通知先が未設定のため、通知はスキップします"; exit 0; fi
          payload=$(printf '{"content":"%s"}' "⚠️ スナイパーの実行が失敗しました。データが更新されていない可能性があります。ログ: $RUN_URL")
          curl -sS -o /dev/null -X POST -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL"
