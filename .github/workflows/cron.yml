name: Imas Ticket Checker
on:
  schedule:
    # 毎日UTC 18:00 (日本時間 翌03:00) ＝ 深夜の更新
    - cron: '0 18 * * *'
    # 毎日UTC 04:00 (日本時間 13:00) ＝ お昼の更新
    - cron: '0 4 * * *'
  workflow_dispatch: # 手動実行用

# ★追加①：GitHub Actions (ボット) がファイルをリポジトリに保存するための権限
permissions:
  contents: write

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm install
        
      - name: Install Headless Browser
        run: npx playwright install chromium
        
      - name: Run Script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          PUBLIC_NOTION_DB_ID: ${{ secrets.PUBLIC_NOTION_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node index.js

      # ★追加②：生成された events.json を自動でコミット＆プッシュ
      - name: Commit and Push events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          # 差分がある場合のみコミットしてプッシュする安全な書き方
          git diff --staged --quiet || git commit -m "chore: update events.json from Notion DB"
          git push
