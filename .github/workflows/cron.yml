name: Imas Ticket Checker
# アイマスチケットチェッカー
#  - 定期実行（お昼・夕方）: 公式サイトの新着記事をAIで読み取り、Notionに反映して events.json を作る
#  - 手動実行: 「実行モード」で、通常（公式サイト＋AI）か、同期のみ（Notionの今の内容から events.json だけ作り直す）を選べる
on:
  schedule:
    # 毎日UTC 09:23 (日本時間 18:23) ＝ 夕方の更新
    #   アメリカの深夜（太平洋時間 1:23）でAIが混みにくく、無料枠のリセット（日本時間17時）直後なので、その日の枠をまるごと使える
    #   （0分ちょうどはGitHubが混み合うので、ずらしています）
    - cron: '23 9 * * *'
    # 毎日UTC 04:43 (日本時間 13:43) ＝ お昼の更新
    - cron: '43 4 * * *'
  workflow_dispatch: # 手動実行用
    inputs:
      mode:
        description: '実行モード。通常 = 公式サイト＋AIで取得 / 同期のみ = 公式サイトもAIも使わず、Notionの今の内容から events.json だけ作り直す（手入力の反映・画面の確認用）'
        type: choice
        options:
          - 通常
          - 同期のみ
        default: 通常
      dry:
        description: 'ドライラン（Notionにもevents.jsonにも書き込まない。試運転用）'
        type: boolean
        default: false
      max:
        description: '（任意・通常のときだけ）新しい記事を最大この件数だけ処理する。空欄なら全件'
        type: string
        required: false
        default: ''

# GitHub Actions (ボット) がファイルをリポジトリに保存するための権限
permissions:
  contents: write

# 2つの実行が同時に events.json を書き込まないようにする（後から来た方は、前の実行が終わるまで待つ）
concurrency:
  group: imas-write
  cancel-in-progress: false

jobs:
  run-checker:
    runs-on: ubuntu-latest
    env:
      # 定期実行のときは inputs が空になるので「通常」として扱う
      SYNC_ONLY: ${{ inputs.mode == '同期のみ' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ブラウザ（Chromium）は通常モードのときだけ。毎回ダウンロードしないよう、Playwrightのバージョンごとに保存しておく
      - name: Check Playwright version
        if: env.SYNC_ONLY != 'true'
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Headless Browser
        if: env.SYNC_ONLY != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Headless Browser
        if: env.SYNC_ONLY != 'true'
        run: npx playwright install chromium

      - name: Run Script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_SLOT_DB_ID: ${{ secrets.NOTION_SLOT_DB_ID }}
          NOTION_SCHEDULE_DB_ID: ${{ secrets.NOTION_SCHEDULE_DB_ID }}
          NOTION_LOG_DB_ID: ${{ secrets.NOTION_LOG_DB_ID }}
          NOTION_MERCH_DB_ID: ${{ secrets.NOTION_MERCH_DB_ID }}   # 任意。未設定なら、物販情報の取得は行われません
          NOTION_APPLICATION_DB_ID: ${{ secrets.NOTION_APPLICATION_DB_ID }}
          APPLICANTS: ${{ secrets.APPLICANTS }}   # 任意。未設定なら、申込記録の自動作成は行われません
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # 任意。未設定なら、通知は送られません
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 使うAIモデル。最新版（gemini-flash-latest）は混雑で止まりやすいので、1つ前のFlashに固定し、
          # 混雑・1日の上限のときだけ、同じ格の最新版Flashで同じ依頼をやり直す（軽量モデルは使わない）
          GEMINI_PRIMARY: gemini-3.6-flash
          GEMINI_MODELS: gemini-3.8-flash
          DRY: ${{ inputs.dry }}
          MAX: ${{ inputs.max }}
        run: |
          args=()
          if [ "$SYNC_ONLY" = "true" ]; then args+=(--sync-only); fi
          if [ "$DRY" = "true" ]; then args+=(--dry); fi
          if [ -n "$MAX" ] && [ "$SYNC_ONLY" != "true" ]; then args+=("--max=$MAX"); fi
          node index.js "${args[@]}"

      # 生成された events.json を自動でコミット＆プッシュ（ドライランのときは変更なし）
      - name: Commit and Push events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json meta.json
          # 差分がある場合のみコミットしてプッシュする。実行中に画面からファイルを上げていても失敗しないよう、先に最新を取り込む
          if ! git diff --staged --quiet; then
            if [ "$SYNC_ONLY" = "true" ]; then msg="chore: sync events.json from Notion DB"; else msg="chore: update events.json from Notion DB"; fi
            git commit -m "$msg"
            git pull --rebase
            git push
          fi

      # 失敗したときだけ、Discordに通知（DISCORD_WEBHOOK_URL が未設定なら何もしない）
      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "通知先が未設定のため、通知はスキップします"; exit 0; fi
          if [ "$SYNC_ONLY" = "true" ]; then what="アイマスチケットチェッカー（同期のみ）"; else what="アイマスチケットチェッカー"; fi
          payload=$(printf '{"content":"%s"}' "⚠️ ${what}の実行が失敗しました。データが更新されていない可能性があります。ログ: $RUN_URL")
          curl -sS -o /dev/null -X POST -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL"
